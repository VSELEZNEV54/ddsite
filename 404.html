<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · Darlein Defense</title>
<meta name="robots" content="noindex">
<script>
/* Прежние страницы переехали в папку prototype/: старые ссылки открывают их там. */
(function () {
  var base = /github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
  var rest = location.pathname.slice(base.length), m = /^([a-z0-9-]+)\.html$/.exec(rest);
  var moved = ['agata', 'arrowhead', 'arsenal', 'backeye', 'blackfly', 'careers', 'company', 'contacts', 'dropfield', 'echo', 'elza', 'eva', 'hex', 'highfast', 'intel', 'intel-article', 'investors', 'legal', 'nomad', 'partners', 'projects', 'seal', 'shield', 'sitemap', 'thanks', 'warden'];
  if (m && moved.indexOf(m[1]) > -1) location.replace(base + 'prototype/' + rest + location.search + location.hash);
  else document.addEventListener('DOMContentLoaded', function () { document.getElementById('home').href = base; });
})();
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090A0C;color:#fff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;text-align:center;padding:24px}
p{color:rgba(255,255,255,.62);margin:16px 0 32px}a{color:#fff;border-bottom:1px solid #67FFD9;text-decoration:none;padding-bottom:4px}
</style>
</head>
<body>
<div><h1 style="font-weight:400;margin:0">Страница не найдена</h1><p>Такой страницы нет или адрес изменился.</p><a id="home" href="/">На главную</a></div>
</body>
</html>
